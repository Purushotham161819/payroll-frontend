<div class="workspace"><aside class="sidebar"><a class="brand" routerLink="/" [attr.aria-label]="productBrand + ' home'"><span class="brand-mark">P</span><span class="brand-copy"><strong class="product-name">PayStream,</strong><span class="product-byline">An Excelhire Product</span></span></a><div class="nav-label">WORKSPACE</div><nav aria-label="Main navigation"><a routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"><span aria-hidden="true">&#9636;</span> Employees</a><a routerLink="/settings" routerLinkActive="nav-active" ariaCurrentWhenActive="page"><span aria-hidden="true">&#9881;</span> Settings</a>@if (auth.user()?.role === 'admin') {<a routerLink="/users" routerLinkActive="nav-active" ariaCurrentWhenActive="page"><span aria-hidden="true">&#9823;</span> User Management</a>}</nav><div class="sidebar-bottom">People first.<br><span>Everything in one place.</span></div></aside><div class="main-shell"><header class="topbar"><span class="workspace-context">People &amp; operations</span><span class="organization-name" [title]="organization.displayName()" [attr.aria-label]="'Organization: ' + organization.displayName()">{{organization.displayName()}}</span><div class="account-area"><button class="secondary" (click)="logout()" [disabled]="loggingOut">{{loggingOut ? 'Signing out...' : 'Sign out'}}</button></div>@if (logoutError) { <span class="logout-error" role="alert">{{logoutError}}</span> }</header><main><router-outlet /></main><footer>{{productBrand}} <span>Employee workspace</span></footer></div></div>
