<section class="auth-page">
    <form #form="ngForm" (ngSubmit)="save()" class="auth-card" [attr.aria-busy]="busy()">
      <div class="brand"><span class="brand-mark" aria-hidden="true">P</span><p>PayStream / Account security</p></div><ps-page-header title="Set your new password" subtitle="Replace your temporary password before entering your workspace. You will sign in again afterward." />
      <ps-form-field label="Current password"><input psFieldControl
          name="currentPassword"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="currentPassword"
          required
          minlength="8"
          maxlength="128"
      /></ps-form-field>
      <ps-form-field label="New password"><input psFieldControl
          name="password"
          type="password"
          autocomplete="new-password"
          [(ngModel)]="password"
          required
          minlength="8"
          maxlength="128"
      /></ps-form-field>
      <ps-form-field label="Confirm new password"><input psFieldControl
          name="confirmation"
          type="password"
          autocomplete="new-password"
          [(ngModel)]="confirmation"
          required
          minlength="8"
          maxlength="128"
      /></ps-form-field>
      <small>Password must be at least 8 characters long.</small>
      @if (error()) {
        <p class="notice error" role="alert">{{ error() }}</p>
      }
      <div class="actions">
        <button type="submit" psButton [disabled]="form.invalid || busy() || password !== confirmation">
          Change password</button
        ><button type="button" psButton variant="secondary" icon="logout" [disabled]="busy()" (click)="signOut()">
          Sign out
        </button>
      </div>
    </form>
  </section>
